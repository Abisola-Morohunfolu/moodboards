# Local backing services for Moodboard. The API, workers, and web app run on the host
# and connect to these through the ports below. Values come from .env (see .env.example).

name: moodboard

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moodboard}
      POSTGRES_USER: ${POSTGRES_USER:-moodboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moodboard}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Migrations create the schema. The old postgres-data volume is retained.
      - postgres-migrations-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Eviction would reset rate limits or lose future BullMQ jobs.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - '${REDIS_MAXMEMORY:-256mb}'
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  # Opt-in: docker compose --profile stripe up. Needs a Stripe test-mode key in .env.
  stripe:
    image: stripe/stripe-cli
    profiles: ['stripe']
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command:
      - listen
      - --forward-to
      - ${STRIPE_WEBHOOK_FORWARD_TO:-http://host.docker.internal:3001/webhooks/stripe}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres-data:
  postgres-migrations-data:
  redis-data:
