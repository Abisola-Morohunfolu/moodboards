name: Backend checks
on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: moodboard_test
          POSTGRES_USER: moodboard_test
          POSTGRES_PASSWORD: moodboard_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U moodboard_test -d moodboard_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 3s --health-retries 30
    env:
      TEST_STORAGE_ENDPOINT: http://127.0.0.1:9002
      TEST_STORAGE_BUCKET: moodboard-test-assets
      TEST_DATABASE_URL: postgres://moodboard_test:moodboard_test@127.0.0.1:5433/moodboard_test
      TEST_REDIS_URL: redis://127.0.0.1:6380/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f compose.test.yaml up -d --wait --build minio
      - run: pnpm check
