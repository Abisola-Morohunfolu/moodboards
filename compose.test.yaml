name: moodboard-test
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: moodboard_test
      POSTGRES_USER: moodboard_test
      POSTGRES_PASSWORD: moodboard_test
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moodboard_test -d moodboard_test']
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command:
      ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${TEST_REDIS_PORT:-6380}:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30
  minio:
    image: moodboard-minio-local:2025-10-15
    build: ./docker/minio
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: moodboard_test
      MINIO_ROOT_PASSWORD: moodboard_test_secret
    ports:
      - '127.0.0.1:${TEST_MINIO_PORT:-9002}:9000'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 1s
      timeout: 3s
      retries: 30
